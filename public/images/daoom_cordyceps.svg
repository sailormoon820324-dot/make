    <rect x="20" y="40" width="100" height="190" rx="10" fill="#F0DC82" stroke="#D1B85A" stroke-width="2" />
    <text x="35" y="70" font-family="sans-serif" font-size="10" font-weight="900" fill="#4A341E">daoom</text>
    <text x="30" y="120" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" fill="#3D2916">누에동충하초</text>
    <circle cx="70" cy="165" r="22" fill="#E5CA68" />
