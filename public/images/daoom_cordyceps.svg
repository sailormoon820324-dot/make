    <!-- Luxury Dark Gold Gift Box on right -->
    <rect x="140" y="20" width="240" height="220" rx="8" fill="#523924" stroke="#3D2716" stroke-width="3" />
    <!-- Gold vertical band -->
    <rect x="270" y="20" width="40" height="220" fill="#751818" />
