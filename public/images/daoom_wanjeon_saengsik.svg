<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Light beige background -->
  <rect width="600" height="600" fill="#E8E4DA" />
  <ellipse cx="300" cy="460" rx="220" ry="25" fill="#000000" opacity="0.15" />

  <!-- Single stick on left -->
  <g transform="translate(130, 240)">
    <rect x="0" y="0" width="40" height="200" rx="6" fill="#FFFFFF" stroke="#C2D9C7" stroke-width="2" />
    <text x="8" y="25" font-family="sans-serif" font-size="9" font-weight="900" fill="#2D6A4F">daoom</text>
    <text x="5" y="60" font-family="'Pretendard', sans-serif" font-size="9" font-weight="bold" fill="#2D6A4F">완전생식</text>
    <circle cx="20" cy="130" r="14" fill="#E8F4EC" />
    <text x="13" y="135" font-size="12">🌱</text>
  </g>

  <!-- Lime Green Box in center -->
  <g transform="translate(190, 160)">
    <rect width="280" height="280" rx="8" fill="#E5EFE4" stroke="#B8D8BC" stroke-width="2" />
    <!-- Handle -->
    <rect x="90" y="-12" width="100" height="16" rx="8" fill="#FFFFFF" stroke="#B8D8BC" stroke-width="2" />
    <!-- Doctor signature badge -->
    <text x="25" y="45" font-family="'Pretendard', sans-serif" font-size="12" font-weight="bold" fill="#52795B">이학박사 김수경의</text>
    <text x="25" y="80" font-family="'Pretendard', sans-serif" font-size="26" font-weight="900" fill="#1E4D2B">완전생식</text>
    <text x="130" y="80" font-family="'Pretendard', sans-serif" font-size="16" font-weight="bold" fill="#7FA887">프리미엄</text>
    <!-- Illustration with doctor icon and whole grains -->
    <rect x="25" y="105" width="230" height="150" rx="8" fill="#FFFFFF" stroke="#C8DEC9" stroke-width="1.5" />
    <circle cx="75" cy="180" r="35" fill="#EBF5ED" />
    <text x="55" y="192" font-size="36">👨‍⚕️🌾</text>
    <text x="125" y="165" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" fill="#1E4D2B">65가지 자연 원료</text>
    <text x="125" y="185" font-family="'Pretendard', sans-serif" font-size="11" fill="#52795B">생식 40g x 30포</text>
    <text x="125" y="205" font-family="'Pretendard', sans-serif" font-size="10" font-weight="bold" fill="#D9534F">다움 프리미엄 라인</text>
  </g>
</svg>
