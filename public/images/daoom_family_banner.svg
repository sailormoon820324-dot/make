<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="warmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E3B31" />
      <stop offset="50%" stop-color="#34251E" />
      <stop offset="100%" stop-color="#211510" />
    </linearGradient>
    <radialGradient id="familyLight" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(255, 230, 200, 0.25)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.65)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="480" fill="url(#warmBg)" />
  
  <!-- Subtle silhouette representing smiling multi-generation family having healthy breakfast -->
  <!-- Grandparents, parents, children at dining table with green fresh juices and fruit -->
  <g opacity="0.35" transform="translate(150, 100)">
    <!-- Dining table -->
    <rect x="0" y="240" width="1300" height="140" fill="#2E1C14" rx="8" />
    <!-- Juice glasses on table -->
    <rect x="420" y="190" width="30" height="55" rx="4" fill="#F5A623" />
    <rect x="580" y="180" width="35" height="65" rx="4" fill="#52B788" />
    <rect x="740" y="185" width="30" height="60" rx="4" fill="#F5A623" />
    <rect x="900" y="190" width="32" height="55" rx="4" fill="#52B788" />

    <!-- Grandfather figure -->
    <circle cx="350" cy="90" r="45" fill="#E8D5C4" />
    <path d="M 270 240 C 270 150 430 150 430 240 Z" fill="#4A6572" />
    <!-- Grandmother figure -->
    <circle cx="500" cy="95" r="42" fill="#E8D5C4" />
    <path d="M 430 240 C 430 155 570 155 570 240 Z" fill="#D9822B" />
    <!-- Father figure -->
    <circle cx="680" cy="80" r="48" fill="#E8D5C4" />
    <path d="M 600 240 C 600 145 760 145 760 240 Z" fill="#3D5A80" />
    <!-- Mother figure -->
    <circle cx="840" cy="85" r="44" fill="#E8D5C4" />
    <path d="M 760 240 C 760 150 920 150 920 240 Z" fill="#E07A5F" />
    <!-- Children figures -->
    <circle cx="1000" cy="115" r="38" fill="#E8D5C4" />
    <path d="M 940 240 C 940 170 1060 170 1060 240 Z" fill="#81B29A" />
  </g>

  <!-- Warm light overlay -->
  <rect width="1600" height="480" fill="url(#familyLight)" />
</svg>
