<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Light beige card background matching Daoom style -->
  <rect width="600" height="600" fill="#E8E4DA" />
  
  <!-- Shadow -->
  <ellipse cx="300" cy="460" rx="220" ry="25" fill="#000000" opacity="0.15" />

  <!-- Single stick pouch on left -->
  <g transform="translate(130, 260)">
    <rect x="0" y="0" width="40" height="180" rx="6" fill="#FFFFFF" stroke="#D1C7B7" stroke-width="2" />
    <text x="8" y="30" font-family="sans-serif" font-size="10" font-weight="900" fill="#2D6A4F">daoom</text>
    <text x="6" y="65" font-family="'Pretendard', sans-serif" font-size="10" font-weight="bold" fill="#333333">유기농</text>
    <text x="6" y="80" font-family="'Pretendard', sans-serif" font-size="10" font-weight="bold" fill="#8C6D4F">온백생식</text>
    <circle cx="20" cy="120" r="12" fill="#E8F2EC" />
    <text x="13" y="125" font-size="12">🌾</text>
  </g>

  <!-- Big White Box in center -->
  <g transform="translate(190, 180)">
    <!-- Box Body -->
    <rect width="280" height="260" rx="8" fill="#FFFFFF" stroke="#D5CBB9" stroke-width="2" />
    <!-- Handle -->
    <rect x="90" y="-12" width="100" height="16" rx="8" fill="#F4EFE6" stroke="#D5CBB9" stroke-width="2" />
    <!-- Text -->
    <text x="25" y="40" font-family="sans-serif" font-size="14" font-weight="900" fill="#2D6A4F">daoom</text>
    <text x="25" y="80" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#555555">유기농</text>
    <text x="25" y="110" font-family="'Pretendard', sans-serif" font-size="26" font-weight="900" fill="#2D6A4F">온백생식</text>
    <!-- Illustration -->
    <rect x="25" y="130" width="230" height="100" rx="6" fill="#FAF8F5" stroke="#EFE9DC" stroke-width="1" />
    <circle cx="70" cy="180" r="30" fill="#E8F2EC" />
    <text x="50" y="192" font-size="34">🌾🥗</text>
    <text x="115" y="175" font-family="'Pretendard', sans-serif" font-size="12" font-weight="bold" fill="#2E4A35">100% 국내산 유기농</text>
    <text x="115" y="195" font-family="'Pretendard', sans-serif" font-size="11" fill="#758A7C">35g x 30포 / 1개월분</text>
  </g>
</svg>
