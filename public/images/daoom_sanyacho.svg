<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#E8E4DA" />
  <ellipse cx="300" cy="480" rx="180" ry="20" fill="#000000" opacity="0.15" />
  <!-- Sanyacho Gift Paper Bag & Glass Bottle -->
  <g transform="translate(130, 160)">
    <!-- Kraft shopping box bag with rope handle -->
    <rect x="0" y="40" width="150" height="260" rx="4" fill="#C2AD91" stroke="#A89274" stroke-width="2" />
    <!-- rope handle -->
    <path d="M 40 40 Q 75 -20 110 40" stroke="#7A6348" stroke-width="5" fill="none" />
    <text x="15" y="80" font-family="sans-serif" font-size="11" font-weight="900" fill="#2D6A4F">daoom</text>
    <text x="15" y="140" font-family="'Pretendard', sans-serif" font-size="22" font-weight="900" fill="#2D4D33">산야초 선</text>
    <text x="15" y="170" font-family="'Pretendard', sans-serif" font-size="10" fill="#4B6850">야생 산야초 60여종 발효원액</text>

    <!-- Glass Extract Bottle on right -->
    <rect x="180" y="90" width="100" height="210" rx="18" fill="#3D2B1F" stroke="#261A13" stroke-width="2" />
    <!-- Bottle neck & golden cap -->
    <rect x="210" y="50" width="40" height="40" fill="#2B1D14" />
    <rect x="205" y="40" width="50" height="20" rx="4" fill="#C89A3B" />
    <!-- Label on bottle -->
    <rect x="190" y="130" width="80" height="120" rx="4" fill="#FAF5E8" />
    <text x="200" y="160" font-family="sans-serif" font-size="9" font-weight="bold" fill="#2D6A4F">daoom</text>
    <text x="198" y="190" font-family="'Pretendard', sans-serif" font-size="14" font-weight="900" fill="#1E3A2B">산야초</text>
    <text x="202" y="215" font-family="'Pretendard', sans-serif" font-size="10" font-weight="bold" fill="#C89A3B">선(選)</text>
  </g>
</svg>
