    <text x="15" y="44" font-family="'Pretendard', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">NK뉴트리킹</text>
    <text x="20" y="100" font-family="'Pretendard', sans-serif" font-size="22" font-weight="900" fill="#8C3A27">십전 쌍화차</text>
    <text x="20" y="130" font-family="'Pretendard', sans-serif" font-size="11" fill="#6B533E">전통 10가지 한방 원료 배합</text>
