<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="farmSoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF6EE" />
      <stop offset="60%" stop-color="#CCE8D4" />
      <stop offset="100%" stop-color="#A7D6B3" />
    </linearGradient>
    <linearGradient id="woodTable3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3ECE0" />
      <stop offset="100%" stop-color="#DECDB3" />
    </linearGradient>
    <linearGradient id="tabletGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#70A878" />
      <stop offset="100%" stop-color="#4F8557" />
    </linearGradient>
  </defs>

  <!-- Sunny Outdoor Farm Background -->
  <rect width="800" height="380" fill="url(#farmSoil)" />
  <!-- Sun Flare -->
  <circle cx="650" cy="50" r="100" fill="#FFFDE0" opacity="0.7" />
  <circle cx="650" cy="50" r="50" fill="#FFFFFF" opacity="0.9" />

  <!-- Kale farm plants in background -->
  <g transform="translate(0, 140)">
    <circle cx="100" cy="140" r="80" fill="#387747" opacity="0.7" />
    <circle cx="250" cy="160" r="90" fill="#2E683D" opacity="0.8" />
    <circle cx="450" cy="150" r="80" fill="#387747" opacity="0.7" />
    <circle cx="650" cy="160" r="90" fill="#2E683D" opacity="0.8" />
  </g>

  <!-- Wooden Table -->
  <rect y="380" width="800" height="220" fill="url(#woodTable3)" />
  <line x1="0" y1="420" x2="800" y2="420" stroke="#C9B89D" stroke-width="2" />
  <line x1="0" y1="480" x2="800" y2="480" stroke="#C9B89D" stroke-width="2" />

  <!-- Soil scatter on wood for earthy feel -->
  <ellipse cx="140" cy="460" rx="60" ry="15" fill="#6B5238" opacity="0.5" />
  <ellipse cx="680" cy="450" rx="70" ry="18" fill="#6B5238" opacity="0.5" />

  <!-- Big Fresh Kale leaves beside bottle -->
  <g transform="translate(300, 240)">
    <path d="M 0 140 Q -80 0 50 -30 Q 150 -10 120 140 Z" fill="#2D6A4F" />
    <path d="M 20 140 Q 20 20 80 0 Q 130 10 100 140 Z" fill="#40916C" />
    <path d="M 120 140 Q 180 30 240 60 Q 280 120 180 140 Z" fill="#52B788" />
  </g>

  <!-- Burlap fabric patch on table -->
  <polygon points="240,430 450,420 480,550 210,540" fill="#D2BE9E" stroke="#B8A280" stroke-width="2" />

  <!-- White Bottle of Daoom Kale Tablets in Center -->
  <g transform="translate(420, 230)">
    <!-- Bottle shadow -->
    <ellipse cx="65" cy="220" rx="55" ry="15" fill="#000000" opacity="0.2" />
    <!-- Bottle body -->
    <rect x="10" y="55" width="110" height="165" rx="16" fill="#FFFFFF" stroke="#D3CDC0" stroke-width="2.5" />
    <!-- Neck -->
    <rect x="28" y="28" width="74" height="30" rx="4" fill="#FFFFFF" stroke="#D3CDC0" stroke-width="2" />
    <!-- White Cap -->
    <rect x="22" y="5" width="86" height="28" rx="8" fill="#FFFFFF" stroke="#C4BCAD" stroke-width="2" />
    <!-- Cap Ridges -->
    <line x1="32" y1="8" x2="32" y2="30" stroke="#E2DACD" stroke-width="2" />
    <line x1="45" y1="8" x2="45" y2="30" stroke="#E2DACD" stroke-width="2" />
    <line x1="58" y1="8" x2="58" y2="30" stroke="#E2DACD" stroke-width="2" />
    <line x1="71" y1="8" x2="71" y2="30" stroke="#E2DACD" stroke-width="2" />
    <line x1="84" y1="8" x2="84" y2="30" stroke="#E2DACD" stroke-width="2" />

    <!-- Label -->
    <rect x="14" y="65" width="102" height="145" rx="6" fill="#FAF8F5" />
    <text x="22" y="85" font-family="sans-serif" font-size="9" font-weight="900" fill="#2D6A4F">daoom</text>
    <rect x="80" y="75" width="28" height="15" rx="2" fill="#E8F2EC" stroke="#2D6A4F" stroke-width="1" />
    <text x="83" y="86" font-family="sans-serif" font-size="7" font-weight="bold" fill="#2D6A4F">유기농</text>

    <text x="22" y="112" font-family="'Pretendard', sans-serif" font-size="11" font-weight="bold" fill="#3D5A45">김수경 엽록소</text>
    <text x="22" y="132" font-family="'Pretendard', sans-serif" font-size="13" font-weight="black" fill="#1E3A2B">유기농 케일 정</text>
    <text x="22" y="148" font-family="sans-serif" font-size="8" fill="#758A7C">동결건조 케일 100%</text>

    <line x1="22" y1="158" x2="105" y2="158" stroke="#E5DEC9" stroke-width="1" />
    <text x="22" y="172" font-family="sans-serif" font-size="8" font-weight="bold" fill="#2D6A4F">360정 (2개월분)</text>
    <text x="22" y="185" font-family="sans-serif" font-size="7" fill="#7D9384">물과 함께 간편 섭취</text>
  </g>

  <!-- Spilled Green Kale Tablets in front of bottle -->
  <g transform="translate(300, 430)">
    <!-- Group of oval green pills -->
    <rect x="0" y="0" width="28" height="16" rx="8" fill="url(#tabletGrad)" stroke="#396B40" stroke-width="1" transform="rotate(-20 0 0)" />
    <rect x="25" y="15" width="28" height="16" rx="8" fill="url(#tabletGrad)" stroke="#396B40" stroke-width="1" transform="rotate(10 25 15)" />
    <rect x="50" y="5" width="28" height="16" rx="8" fill="url(#tabletGrad)" stroke="#396B40" stroke-width="1" transform="rotate(-35 50 5)" />
    <rect x="15" y="30" width="28" height="16" rx="8" fill="url(#tabletGrad)" stroke="#396B40" stroke-width="1" transform="rotate(25 15 30)" />
    <rect x="45" y="35" width="28" height="16" rx="8" fill="url(#tabletGrad)" stroke="#396B40" stroke-width="1" transform="rotate(-10 45 35)" />
    <rect x="75" y="25" width="28" height="16" rx="8" fill="url(#tabletGrad)" stroke="#396B40" stroke-width="1" transform="rotate(40 75 25)" />
    <rect x="80" y="55" width="28" height="16" rx="8" fill="url(#tabletGrad)" stroke="#396B40" stroke-width="1" transform="rotate(-15 80 55)" />
    <rect x="35" y="55" width="28" height="16" rx="8" fill="url(#tabletGrad)" stroke="#396B40" stroke-width="1" transform="rotate(5 35 55)" />
  </g>

  <!-- Top Banner Badge -->
  <rect x="490" y="20" width="280" height="44" rx="22" fill="#2D6A4F" />
  <text x="515" y="47" font-family="'Pretendard', sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">
    간편하게 챙기는 유기농 케일 100% 정
  </text>
</svg>
